feature: "code-review-skill"
signal_lost_initial: 19

budget:
  max_rounds: 3
  reviewer_retry_limit: 2

rounds:
  - round: 1
    signal_lost_before: 19
    budget_context:
      remaining_rounds_at_start: 2
      stagnation_count_at_start: 0
      net_rot_previous_round: 0
      strategy_hint: explore
    items_triaged: 19
    triage_result:
      fix:
        - "P1: Prose-only enforcement across schema, checkout, reconnaissance, payload validation, and evaluator evidence"
        - "P2: Dry-run evaluator fixture metadata and gh field availability were unverified"
        - "P3: GitHub posting endpoint coordinate ambiguity and payload contract were only documented procedurally"
        - "P4: Contract checks were inspection-only and README discoverability lacked executable verification"
      accept: []
      defer:
        - "Full live GitHub POST validation remains out of scope without an open PR that can receive test comments"
        - "Full /code-review dry-run execution remains deferred until the skill can be invoked in a Claude Code runtime against the fixture repository"
    fixes_applied: 3
    fixes_scar_count: 4
    budget_spent:
      implementer_dispatches: 0
      reviewer_dispatches: 0
      reviewer_retries: 0
      validation_runs: 2
    evidence_gained:
      - "scripts/verify-code-review-artifacts.sh passed locally"
      - "gh pr view fixture metadata succeeded against a private closed PR fixture; committed evidence is sanitized"
      - "fixture-verification.md records a sanitized template for PR state, headRefOid, commit count, and changed files"
      - "Skill now stops posting when owner/repo/pull number cannot be derived unambiguously"
    residual_risk:
      - "Artifact checker validates contract presence, not actual review quality"
      - "Generic reviewer effectiveness still depends on the closed PR dry-run evaluator"
      - "Live POST behavior is not validated by the closed PR fixture"
      - "Review-unit grouping remains heuristic rather than algorithmic"
    signal_lost_after: 10
    decision: stop
    decision_reason: "Focused iteration fixes reduced the largest executable-verification gaps; remaining risks require runtime dry-run or live open PR validation."
